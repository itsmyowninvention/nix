name: Nix CI

on:
  # Only main: feature branches are covered by pull_request below, so
  # pushing a PR branch doesn't run the same build twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting (alejandra)
        run: nix fmt . -- --check

  build:
    strategy:
      matrix:
        host: [b850m, hades]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make room for Nix
        # Dedicated ~115GB BTRFS volume for /nix. Cleaves (the action default)
        # /opt, /usr/local, docker, snap and apt bloat in the background via
        # rmz while the build runs. Deletion of /opt/hostedtoolcache is safe
        # here: cachix installs into the nix profile, not the tool cache.
        continue-on-error: true
        uses: wimpysworld/nothing-but-nix@v11
        with:
          hatchet-protocol: cleave
          # install-nix-action's multi-user installer does non-sudo work
          # inside /nix (temp unpack under /nix/tmp); grant user ownership.
          nix-permission-edict: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        env:
          # nothing-but-nix (verified still in v11, 2026-11-06) exports TMPDIR
          # on its /nix volume (a root-owned 1777 dir) and the multi-user
          # installer then fails to cd into its own extraction path there.
          # Use the runner's own temp dir for the install, like a stock
          # runner would (derivation builds still go to the volume via
          # build-dir below).
          TMPDIR: ${{ runner.temp }}
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Build derivations on the nothing-but-nix BTRFS volume, not the
            # root disk (default TMPDIR)
            build-dir = /nix/build
            # Keep as much room as possible for the store while building
            min-free = 5368709120
            max-free = 10737418240
            # CDN flakiness from GH runners (e.g. fetchurl of the QQ .deb,
            # curl(35) connection reset): retry more, fail faster per attempt
            download-attempts = 15
            connect-timeout = 15
            # NOTE: intentionally no keep-outputs / keep-env-derivations here.
            # They root the whole build graph (~75 GB), so GC could not shrink
            # the store and every cache save was a ~26 GB tar — far over the
            # 10 GB Actions cache quota, making saves evict each other. Leave
            # them off so gc-max-store-size below can trim the store down to
            # the runtime closure and both hosts' caches fit side by side.

      # Persistent binary cache (survives GHA cache eviction). Hosts
      # consume it declaratively via nix.settings in default.nix, so no
      # manual `cachix use` is needed. Pushes cover only paths
      # cache.nixos.org doesn't already serve.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: itsmyowninvention
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Fork PRs don't receive secrets, so fall back to pull-only:
          # builds still substitute from the (public) cache, they just
          # can't push new paths.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Check flake metadata
        run: nix flake metadata

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
