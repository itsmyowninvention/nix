# Hyprlock lock screen configuration
# Based on the ML4W layout: clock/date in the bottom-right, input box centered
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

image {
    monitor =
    path = ${HOME}/.face
    size = 100
    rounding = -1
    border_size = 4
    border_color = rgb(33ffee)
    rotate = 0
    reload_time = -1
    position = 0, -200
    halign = center
    valign = center
}

# Clock - bottom-right (based on the ML4W layout)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(eeeeee, 1.0)
    font_size = 55
    font_family = sans-serif
    position = -30, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date - bottom-right, below the clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%Y年%m月%d日 %A')"
    color = rgba(cccccc, 1.0)
    font_size = 20
    font_family = sans-serif
    position = -30, 30
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.5)
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(111111)
    inner_color = rgb(171717)
    font_color = rgb(eeeeee)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Enter the password...
    hide_input = false
    rounding = 8
    check_color = rgb(33ffee)
    fail_color = rgb(e04040)
    fail_text = Wrong Password
    position = 0, -20
    halign = center
    valign = center
}
