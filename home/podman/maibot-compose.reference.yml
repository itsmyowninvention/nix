# ⚠️ Reference file (reference only)
#
# The actual MaiBot deployment in this repo is the declarative Nix module: home/podman/maibot.nix
# (based on home-manager podman quadlet: services.podman.networks / .containers).
#
# This file is adapted from the upstream official docker-compose.yml (MaiBot repo, main branch), and exists only to:
#   - compare the nix module against the official orchestration
#   - serve as a take-away if the deployment ever needs to be reproduced temporarily outside Nix
#
# Upstream: https://github.com/Mai-with-u/MaiBot/blob/main/docker-compose.yml
# Official Docker deployment docs: https://docs.mai-mai.org/manual/deployment/docker

services:
  core:
    container_name: maibot-core
    stop_grace_period: 70s # the Runner waits at most 60s for the Worker, leaving extra time for a forced stop
    image: sengokucola/maibot:latest
    environment:
      - TZ=Asia/Shanghai
      - EULA_AGREE=8e6e7d647f7f82d6ea98456b73908656
      - PRIVACY_AGREE=91e5db7659c560bc3545e63859b6ebc0
      - MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED=1
      - MAIBOT_STATISTICS_REPORT_PATH=/MaiMBot/data/maibot_statistics.html
      - HTTP_HOST=0.0.0.0
    ports:
      - "18001:8001" # WebUI
    volumes:
      - ./docker-config/mmc:/MaiMBot/config
      - ./data/MaiMBot:/MaiMBot/data
      - ./data/MaiMBot-plugin-data:/MaiMBot/data/plugins
      - ./data/MaiMBot/emoji:/data/emoji
      - ./data/MaiMBot/plugins:/MaiMBot/plugins
      - ./data/MaiMBot/logs:/MaiMBot/logs
      # - ./depends-data:/MaiMBot/depends-data # the official compose mounts the repo's depends-data; not needed for nix/image deployments
    restart: always
    networks:
      - maibot

  napcat:
    container_name: maibot-napcat
    image: mlikiowa/napcat-docker:latest
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099" # NapCat WebUI (QR-code login)
    volumes:
      - ./docker-config/napcat:/app/napcat/config
      - ./data/qq:/app/.config/QQ
      - ./data/MaiMBot:/MaiMBot/data
    restart: always
    networks:
      - maibot
    aliases:
      - napcat

  # Optional: web viewer for the SQLite database (browse MaiBot memory/data)
  # Note: the coleifer/sqlite-web image does not support arm64
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: maibot-sqlite-web
    restart: always
    ports:
      - "8120:8080"
    volumes:
      - ./data/MaiMBot:/data/MaiMBot
    environment:
      - SQLITE_DATABASE=MaiMBot/MaiBot.db
    networks:
      - maibot

networks:
  maibot:
    driver: bridge
